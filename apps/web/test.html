<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .left-section {
            flex: 1;
            background: #f5f5f5;
            padding: 60px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .characters {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .character {
            position: absolute;
            transition: transform 0.3s ease-out;
            cursor: pointer;
        }

        .character:hover {
            transform: scale(1.1) !important;
        }

        .eyes {
            position: absolute;
            display: flex;
            gap: 8px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            position: relative;
        }

        .pupil {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.1s ease;
        }

        .semicircle {
            width: 140px;
            height: 70px;
            background: #d17a5c;
            border-radius: 70px 70px 0 0;
            position: absolute;
            bottom: 80px;
            left: 20px;
        }

        .semicircle .eyes {
            top: 25px;
            left: 35px;
        }

        .semicircle .eye {
            width: 8px;
            height: 8px;
        }

        .semicircle .pupil {
            width: 4px;
            height: 4px;
            top: 2px;
            left: 2px;
        }

        .mouth {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            border: 2px solid #000;
            border-top: none;
            border-radius: 0 0 15px 15px;
        }

        .rectangle-tall {
            width: 80px;
            height: 160px;
            background: #6b46c1;
            position: absolute;
            bottom: 80px;
            left: 80px;
            border-radius: 8px;
        }

        .rectangle-tall .eyes {
            top: 30px;
            left: 24px;
        }

        .rectangle-med {
            width: 70px;
            height: 140px;
            background: #2d3748;
            position: absolute;
            bottom: 80px;
            left: 170px;
            border-radius: 8px;
        }

        .rectangle-med .eyes {
            top: 50px;
            left: 19px;
        }

        .rectangle-short {
            width: 65px;
            height: 110px;
            background: #d4af37;
            position: absolute;
            bottom: 80px;
            left: 250px;
            border-radius: 8px;
        }

        .rectangle-short .eyes {
            top: 30px;
            left: 16px;
        }

        .beak {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #8b7b3a;
        }

        .right-section {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo::before {
            content: '✦';
            color: #fff;
            font-size: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #1a202c;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
        }

        .remember-me label {
            margin: 0;
            font-size: 13px;
            color: #718096;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.3s;
        }

        .google-btn:hover {
            border-color: #cbd5e0;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .signup-link {
            text-align: center;
            margin-top: 30px;
            color: #718096;
            font-size: 14px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-section {
                padding: 40px 20px;
            }
            
            .characters {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="characters" id="characters">
                <div class="character semicircle" data-speed="0.03">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
                
                <div class="character rectangle-tall" data-speed="0.05">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <div class="character rectangle-med" data-speed="0.04">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <div class="character rectangle-short" data-speed="0.06">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="beak"></div>
                </div>
            </div>
        </div>
        
        <div class="right-section">
            <div class="logo"></div>
            <h1>Welcome back!</h1>
            <p class="subtitle">Please enter your details</p>
            
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password">
                        <span class="toggle-password" onclick="togglePassword()">👁️</span>
                    </div>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember for 30 days</label>
                </div>
                
                <button type="submit" class="login-btn">Log in</button>
                
                <button type="button" class="google-btn">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Log in with Google
                </button>
            </form>
            
            <div class="signup-link">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        const characters = document.querySelectorAll('.character');
        const container = document.getElementById('characters');
        let mouseX = 0;
        let mouseY = 0;

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Don't track if characters are looking away
            if (charactersLookingAway) return;
            
            // Move characters based on mouse position
            characters.forEach(char => {
                const rect = char.getBoundingClientRect();
                const charX = rect.left + rect.width / 2;
                const charY = rect.top + rect.height / 2;
                
                const deltaX = (mouseX - charX) * parseFloat(char.dataset.speed);
                const deltaY = (mouseY - charY) * parseFloat(char.dataset.speed);
                
                char.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                
                // Update eye pupils
                const eyes = char.querySelectorAll('.pupil');
                eyes.forEach(pupil => {
                    const eye = pupil.parentElement;
                    const eyeRect = eye.getBoundingClientRect();
                    const eyeX = eyeRect.left + eyeRect.width / 2;
                    const eyeY = eyeRect.top + eyeRect.height / 2;
                    
                    const angle = Math.atan2(mouseY - eyeY, mouseX - eyeX);
                    const distance = Math.min(3, Math.hypot(mouseX - eyeX, mouseY - eyeY) / 50);
                    
                    const pupilX = Math.cos(angle) * distance;
                    const pupilY = Math.sin(angle) * distance;
                    
                    pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
                });
            });
        });

        // Add floating animation
        characters.forEach((char, index) => {
            const duration = 3 + index * 0.5;
            const delay = index * 0.2;
            
            function float() {
                char.animate([
                    { transform: 'translateY(0px)' },
                    { transform: 'translateY(-10px)' },
                    { transform: 'translateY(0px)' }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
            }
            
            float();
        });

        // Character reactions
        let charactersLookingAway = false;
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const isShowing = passwordInput.type === 'password';
            passwordInput.type = isShowing ? 'text' : 'password';
            
            if (isShowing) {
                makeCharactersLookAway();
            } else {
                makeCharactersLookNormal();
            }
        }
        
        function makeCharactersLookAway() {
            charactersLookingAway = true;
            const allPupils = document.querySelectorAll('.pupil');
            
            characters.forEach((char, index) => {
                // Characters look away in different directions
                const angles = [180, 90, 270, 180]; // Different angles for variety
                const angle = angles[index];
                const radians = (angle * Math.PI) / 180;
                
                // Add shy animation
                char.style.transition = 'transform 0.3s ease-out';
                const currentTransform = char.style.transform || 'translate(0px, 0px)';
                char.style.transform = currentTransform + ' rotate(' + (index % 2 === 0 ? -5 : 5) + 'deg)';
            });
            
            allPupils.forEach((pupil, index) => {
                const angles = [180, 90, 270, 180];
                const angle = angles[index % 4];
                const radians = (angle * Math.PI) / 180;
                
                pupil.style.transition = 'transform 0.3s ease-out';
                pupil.style.transform = `translate(${Math.cos(radians) * 3}px, ${Math.sin(radians) * 3}px)`;
            });
        }
        
        function makeCharactersLookNormal() {
            charactersLookingAway = false;
            characters.forEach(char => {
                char.style.transition = 'transform 0.3s ease-out';
            });
        }
    </script>
</body>
</html>
